<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log In</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="logo">LifeLink</div>
    </nav>
    <form id="form" style="border:1px solid #ccc" novalidate>
        <div class="container">
            <h1>Log In</h1>
            <p id="error-message"></p>
            <p>Enter your details to log in</p>
            <hr>

            <label for="email"><b>Email</b></label>
            <input type="text" id="email" placeholder="Type Email" name="email">

            <label for="password"><b>Password</b></label>
            <input type="password" id="password" placeholder="Type Password" name="password">

            <p>By logging in you are agreeing to the <a href="privacy.html" style="color:dodgerblue">Privacy Policy</a></p>
            <p>Don't have an account? <a href="signup.html" style="color:dodgerblue">Sign Up</a></p>
            <p>Forgot your password? <a href="forgot-password.html" style="color:dodgerblue">Forgot Password?</a></p>

            <div class="ready_up">
                <button type="submit" class="signupbtn">Log In</button>
            </div>
        </div>
    </form>

    <!-- type="module" is required for Firebase -->
    <script type="module" src="java.js"></script>
</body>
</html>
