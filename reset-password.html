<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Reset Password</title>
        <link rel="stylesheet" href="style.css">
        <script defer src="script.js"></script>
    </head>
    <body>
        <nav>
            <div class="logo">LifeLink</div>
        </nav>
        <form id="new-password-form" style="border:1px solid #ccc">
            <div class="container">
                <h1>Reset Password</h1>

                <label for="password"><b>Password</b></label>
                <input type="password" placeholder="Type Password" name="password" id="new-password" required>

                <label for="repeat-password"><b>Repeat Password</b></label>
                <input type="password" placeholder="Repeat your password" name="repeat-password" id="repeat-new-password" required>

                <div class="ready_up">
                    <button type="submit" class="signupbtn">
                        Reset Password

                    </button>
                </div>








            </div>

        </form>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="script.js"></script>
    </body>
</html>
