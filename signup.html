<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign Up!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="logo">LifeLink</div>
    </nav>
    <form id="form" style="border:1px solid #ccc" novalidate>
        <div class="container">
            <h1>Sign Up</h1>
            <p id="error-message"></p>
            <p>Fill the form to create the account</p>
            <hr>

            <label for="email"><b>Email</b></label>
            <input type="text" id="email" placeholder="Type Email" name="email">

            <label for="password"><b>Password</b></label>
            <input type="password" id="password" placeholder="Type Password" name="password">

            <label for="repeat-password"><b>Repeat Password</b></label>
            <input type="password" id="repeat-password" placeholder="Repeat your password" name="repeat-password">

            <p>By creating this account you are agreeing to the <a href="privacy.html" style="color:dodgerblue">Privacy Policy</a></p>
            <p>Already have an account? <a href="login.html" style="color:dodgerblue">Login</a></p>

            <div class="ready_up">
                <button type="submit" class="signupbtn">Sign Up</button>
            </div>
        </div>
    </form>

   
    <script type="module" src="java.js"></script>
</body>
</html>
