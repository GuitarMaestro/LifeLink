<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password?</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="forgot.js"></script>
</head>
<body>
    <nav>
        <div class="logo">LifeLink</div>
    </nav>

    <form id="reset-form">
        <div class="container">
            <h1>Forgot Password?</h1>
            <p>Type your email down below</p>
            <hr>

            <div>
                <label for="email">Email</label>
                <input type="text" id="email" name="email" placeholder="youremail@gmail.com" autocomplete="email">
                <div id="error-message"></div>
            </div>

            <div class="ready_up">
                <button id="submit-button" type="submit" class="password-reset">Send Reset Link</button>
            </div>

            <p>Remembered it? <a href="login.html">Go back to login</a></p>
        </div>
    </form>
</body>
<script type="module" src="forgot.js"></script>
</html>
